<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t2 d2"><title id="t2">DISS transition dates, 2026</title><desc id="d2">Jul 31 2026 eApp initiation moves to DISS; Sep 30 last NBIS Agency case start; Nov 30 NBIS Agency off. Source DCSA news Aug 4 2026.</desc><rect width="1200" height="300" fill="#0a0a0a"/><text x="40" y="54" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Personnel vetting system change, 2026</text><rect x="40" y="70" width="90" height="8" fill="#F3EE6E"/><line x1="120" y1="150" x2="1080" y2="150" stroke="#fff" stroke-width="4"/><circle cx="180" cy="150" r="16" fill="#F3EE6E"/><text x="180" y="120" text-anchor="middle" fill="#F3EE6E" font-family="Arial" font-size="24" font-weight="700">Jul 31, 2026</text><text x="180" y="200" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19">Industry initiates and</text><text x="180" y="226" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19">reviews eApp in DISS</text><circle cx="600" cy="150" r="16" fill="#F3EE6E"/><text x="600" y="120" text-anchor="middle" fill="#F3EE6E" font-family="Arial" font-size="24" font-weight="700">Sep 30, 2026</text><text x="600" y="200" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19">Last day to start</text><text x="600" y="226" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19">cases in NBIS Agency</text><circle cx="1020" cy="150" r="16" fill="#F3EE6E"/><text x="1020" y="120" text-anchor="middle" fill="#F3EE6E" font-family="Arial" font-size="24" font-weight="700">Nov 30, 2026</text><text x="1020" y="200" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19">NBIS Agency</text><text x="1020" y="226" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19">turned off</text><text x="40" y="280" fill="#bbb" font-family="Arial" font-size="15">Source: DCSA news, “Industry transition to DISS for Initiate and Review (I/R) functionality,” Aug 4, 2026.</text></svg>