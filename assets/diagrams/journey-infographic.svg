<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Example DCSA journey</title><desc id="d">Six steps from sponsorship to continuous vetting. Study aid, not an official timeline.</desc>
<rect width="1200" height="420" fill="#0a0a0a"/>
<text x="40" y="58" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">The DCSA journey, step by step</text>
<rect x="40" y="74" width="90" height="8" fill="#F3EE6E"/>
<rect x="40" y="130" width="170" height="190" rx="10" fill="#111" stroke="#F3EE6E" stroke-width="3"/>
<circle cx="74" cy="168" r="22" fill="#F3EE6E"/><text x="74" y="177" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0a0a0a">1</text>
<text x="56" y="230" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Sponsorship</text>
<text x="56" y="265" fill="#ddd" font-family="Arial" font-size="16">GCA or cleared</text><text x="56" y="288" fill="#ddd" font-family="Arial" font-size="16">contractor, in NISS</text>
<path d="M216 225 l4 0" stroke="#F3EE6E" stroke-width="4"/><path d="M216 217 l10 8 l-10 8z" fill="#F3EE6E"/>
<rect x="230" y="130" width="170" height="190" rx="10" fill="#111" stroke="#F3EE6E" stroke-width="3"/>
<circle cx="264" cy="168" r="22" fill="#F3EE6E"/><text x="264" y="177" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0a0a0a">2</text>
<text x="246" y="230" fill="#fff" font-family="Arial" font-size="21" font-weight="700">FCL package</text>
<text x="246" y="265" fill="#ddd" font-family="Arial" font-size="16">Due Day 20</text><text x="246" y="288" fill="#ddd" font-family="Arial" font-size="16">(welcome email = Day 1)</text>
<path d="M406 225 l4 0" stroke="#F3EE6E" stroke-width="4"/><path d="M406 217 l10 8 l-10 8z" fill="#F3EE6E"/>
<rect x="420" y="130" width="170" height="190" rx="10" fill="#111" stroke="#F3EE6E" stroke-width="3"/>
<circle cx="454" cy="168" r="22" fill="#F3EE6E"/><text x="454" y="177" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0a0a0a">3</text>
<text x="436" y="230" fill="#fff" font-family="Arial" font-size="21" font-weight="700">KMP clearances</text>
<text x="436" y="265" fill="#ddd" font-family="Arial" font-size="16">eApp in DISS +</text><text x="436" y="288" fill="#ddd" font-family="Arial" font-size="16">SWFT prints</text>
<path d="M596 225 l4 0" stroke="#F3EE6E" stroke-width="4"/><path d="M596 217 l10 8 l-10 8z" fill="#F3EE6E"/>
<rect x="610" y="130" width="170" height="190" rx="10" fill="#111" stroke="#F3EE6E" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="644" cy="168" r="22" fill="#F3EE6E"/><text x="644" y="177" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0a0a0a">4</text>
<text x="626" y="230" fill="#fff" font-family="Arial" font-size="21" font-weight="700">eMASS / DAAG</text>
<text x="626" y="265" fill="#ddd" font-family="Arial" font-size="16">Only if processing</text><text x="626" y="288" fill="#ddd" font-family="Arial" font-size="16">classified systems</text>
<path d="M786 225 l4 0" stroke="#F3EE6E" stroke-width="4"/><path d="M786 217 l10 8 l-10 8z" fill="#F3EE6E"/>
<rect x="800" y="130" width="170" height="190" rx="10" fill="#111" stroke="#F3EE6E" stroke-width="3"/>
<circle cx="834" cy="168" r="22" fill="#F3EE6E"/><text x="834" y="177" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0a0a0a">5</text>
<text x="816" y="230" fill="#fff" font-family="Arial" font-size="21" font-weight="700">FCL grant</text>
<text x="816" y="265" fill="#ddd" font-family="Arial" font-size="16">DCSA entity</text><text x="816" y="288" fill="#ddd" font-family="Arial" font-size="16">eligibility</text>
<path d="M976 225 l4 0" stroke="#F3EE6E" stroke-width="4"/><path d="M976 217 l10 8 l-10 8z" fill="#F3EE6E"/>
<rect x="990" y="130" width="170" height="190" rx="10" fill="#111" stroke="#F3EE6E" stroke-width="3"/>
<circle cx="1024" cy="168" r="22" fill="#F3EE6E"/><text x="1024" y="177" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0a0a0a">6</text>
<text x="1006" y="230" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Operate</text>
<text x="1006" y="265" fill="#ddd" font-family="Arial" font-size="16">Continuous vetting</text><text x="1006" y="288" fill="#ddd" font-family="Arial" font-size="16">+ 117.8 reporting</text>
<text x="40" y="378" fill="#bbb" font-family="Arial" font-size="16">Example plan for study, not official timelines. Dashed = conditional. Sources: 32 CFR 117; DCSA FCL Orientation Handbook; DCSA news Aug 4 2026.</text></svg>